async function unlock(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(D.salt),iterations:D.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(D.iv)},key,dec(D.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function attempt(pw,remember){
  try{const html=await unlock(pw);if(remember){try{sessionStorage.setItem('tsdpw',pw);}catch(e){}}show(html);}
  catch(e){document.getElementById('err').textContent='Incorrect password';try{sessionStorage.removeItem('tsdpw');}catch(_){}}
}
document.getElementById('go').addEventListener('click',()=>attempt(document.getElementById('pw').value,true));
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')attempt(document.getElementById('pw').value,true);});
(function(){try{const s=sessionStorage.getItem('tsdpw');if(s)attempt(s,false);}catch(e){}})();
